name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
      - name: Install app and build dependencies
        run: npm ci
        working-directory: app
      - name: Test
        run: npm test
        working-directory: app
      - name: Build installer
        run: |
          $compiler = Join-Path "${env:ProgramFiles(x86)}" 'NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) {
            throw "NSIS compiler was not found at $compiler"
          }
          & $compiler /VERSION
          $env:MAKENSIS_PATH = $compiler
          npm run build:windows
        working-directory: app
      - uses: actions/upload-artifact@v5
        with:
          name: Sputnik-Windows-Installer
          path: release/windows/Sputnik-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/windows/Sputnik-x64-Setup.exe
