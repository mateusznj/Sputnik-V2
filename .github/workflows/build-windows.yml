name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Install app and build dependencies
        run: npm ci
        working-directory: app
      - name: Test
        run: npm test
        working-directory: app
      - name: Build installer
        run: npm run build:windows
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: Sputnik-Windows-Installer
          path: release/windows/Sputnik-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/windows/Sputnik-x64-Setup.exe
